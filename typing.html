<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Code Loop</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      padding: 40px;
    }

    #code {
      white-space: pre;
      border-right: 2px solid #00ff88;
      animation: blink 0.7s infinite step-end alternate;
      max-width: 90vw;
      min-height: 120px;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }
  </style>
</head>
<body>

<pre id="code"></pre>

<script>
  const lines = [
    'const portfolio = () => {',
    '  console.log("Hello, I\'m a developer.");',
    '}',
    'LOADING...',
    '.........................................90%',
    '...100%'
  ];

  const target = document.getElementById("code");
  let lineIndex = 0;
  let charIndex = 0;
  let isDeleting = false;
  let currentLine = "";
  let fullText = "";

  function loopTyping() {
    if (!isDeleting) {
      currentLine = lines[lineIndex];
      if (charIndex < currentLine.length) {
        fullText += currentLine.charAt(charIndex);
        target.textContent = fullText;
        charIndex++;
        setTimeout(loopTyping, 40);
      } else {
        fullText += "\n";
        target.textContent = fullText;
        charIndex = 0;
        lineIndex++;
        if (lineIndex < lines.length) {
          setTimeout(loopTyping, 300);
        } else {
          // Start deleting after a pause
          setTimeout(() => {
            isDeleting = true;
            lineIndex = lines.length - 1;
            currentLine = lines[lineIndex];
            fullText = target.textContent;
            loopTyping();
          }, 1200);
        }
      }
    } else {
      // Deleting mode
      if (fullText.length > 0) {
        fullText = fullText.slice(0, -1);
        target.textContent = fullText;
        setTimeout(loopTyping, 20);
      } else {
        // Restart typing
        isDeleting = false;
        lineIndex = 0;
        charIndex = 0;
        currentLine = "";
        fullText = "";
        setTimeout(loopTyping, 500);
      }
    }
  }

  loopTyping();
</script>

</body>
</html>
