<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Code Loop</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      padding: 40px;
    }

    #code {
      white-space: pre;
      border-right: 2px solid #00ff88;
      animation: blink 0.7s infinite step-end alternate;
      max-width: 90vw;
      min-height: 120px;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }
  </style>
</head>
<body>

<pre id="code"></pre>

<script src="function.js"></script>


</body>
</html>
